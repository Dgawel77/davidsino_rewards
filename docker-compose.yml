services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: davidsino
      POSTGRES_PASSWORD: davidsino_pass
      POSTGRES_DB: davidsino
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U davidsino"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8080"   # container listens on $PORT (8080)
    environment:
      DATABASE_URL: postgresql://davidsino:davidsino_pass@db:5432/davidsino
      ADMIN_PIN: ${ADMIN_PIN:-1234}
      WORKER_PIN: ${WORKER_PIN:-5678}
      # Deposit destinations — see .env.example. Blank = method hidden.
      BTC_ADDRESS: ${BTC_ADDRESS:-}
      ETH_ADDRESS: ${ETH_ADDRESS:-}
      LTC_ADDRESS: ${LTC_ADDRESS:-}
      SOL_ADDRESS: ${SOL_ADDRESS:-}
      USDT_ADDRESS: ${USDT_ADDRESS:-}
      USDC_ADDRESS: ${USDC_ADDRESS:-}
      USDT_NETWORK: ${USDT_NETWORK:-TRC-20}
      USDC_NETWORK: ${USDC_NETWORK:-ERC-20}
      VENMO_HANDLE: ${VENMO_HANDLE:-}
      CASHAPP_HANDLE: ${CASHAPP_HANDLE:-}
      PAYPAL_ME: ${PAYPAL_ME:-}
      ZELLE_HANDLE: ${ZELLE_HANDLE:-}
      MAX_DEPOSIT_USD: ${MAX_DEPOSIT_USD:-10000}
      PRICE_FEED_DISABLED: ${PRICE_FEED_DISABLED:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
